<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1318"/>
      <stop offset="50%" stop-color="#1A2027"/>
      <stop offset="100%" stop-color="#080A0D"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#9D00FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9D00FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>
  
  <!-- Glowing Orbs -->
  <circle cx="540" cy="700" r="450" fill="url(#glow1)" filter="url(#blurFilter)"/>
  <circle cx="750" cy="1200" r="350" fill="url(#glow2)" filter="url(#blurFilter)"/>

  <!-- Geometric Grid & Sci-Fi Elements -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="2">
    <line x1="100" y1="0" x2="100" y2="1920"/>
    <line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="980" y1="0" x2="980" y2="1920"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="0" y1="960" x2="1080" y2="960"/>
    <line x1="0" y1="1440" x2="1080" y2="1440"/>
  </g>

  <!-- Central Futuristic HUD Frame -->
  <rect x="140" y="540" width="800" height="840" rx="24" fill="rgba(30, 37, 43, 0.6)" stroke="#FF3366" stroke-width="3" stroke-dasharray="12 6"/>
  
  <!-- HUD Corners -->
  <path d="M 120 520 L 180 520 M 120 520 L 120 580" stroke="#FF3366" stroke-width="6" fill="none"/>
  <path d="M 960 520 L 900 520 M 960 520 L 960 580" stroke="#FF3366" stroke-width="6" fill="none"/>
  <path d="M 120 1400 L 180 1400 M 120 1400 L 120 1340" stroke="#FF3366" stroke-width="6" fill="none"/>
  <path d="M 960 1400 L 900 1400 M 960 1400 L 960 1340" stroke="#FF3366" stroke-width="6" fill="none"/>

  <!-- Icon Graphic -->
  <circle cx="540" cy="880" r="140" fill="none" stroke="#9D00FF" stroke-width="4"/>
  <polygon points="540,780 610,930 470,930" fill="#FF3366" opacity="0.8"/>

  <!-- Text Overlay -->
  <text x="540" y="1120" font-family="Inter, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    THRILLER REEL
  </text>
  
  <text x="540" y="1180" font-family="Inter, sans-serif" font-size="24" fill="#8A96A3" text-anchor="middle">
    CINEMATIC VISUAL CONCEPT
  </text>

  <!-- Top Badge -->
  <rect x="390" y="240" width="300" height="56" rx="28" fill="rgba(255, 87, 34, 0.2)" stroke="#FF3366" stroke-width="2"/>
  <text x="540" y="276" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FF3366" text-anchor="middle" letter-spacing="2">
    AI GENERATED 9:16
  </text>
</svg>