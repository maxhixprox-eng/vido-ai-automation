<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0914"/>
      <stop offset="40%" stop-color="#18132B"/>
      <stop offset="100%" stop-color="#040308"/>
    </linearGradient>

    <!-- Anime Energy Glowing Orbs -->
    <radialGradient id="animeGlow1" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#FF2A6D" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#05D9E8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF2A6D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="animeGlow2" cx="50%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#05D9E8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#05D9E8" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    
    <filter id="characterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#FF2A6D" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>
  
  <!-- Anime Glowing Background Energy -->
  <circle cx="540" cy="800" r="500" fill="url(#animeGlow1)" filter="url(#glowBlur)"/>
  <circle cx="540" cy="1300" r="400" fill="url(#animeGlow2)" filter="url(#glowBlur)"/>

  <!-- Manga Speed Lines Effect -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="3">
    <line x1="540" y1="800" x2="0" y2="0"/>
    <line x1="540" y1="800" x2="1080" y2="0"/>
    <line x1="540" y1="800" x2="0" y2="1920"/>
    <line x1="540" y1="800" x2="1080" y2="1920"/>
    <line x1="540" y1="800" x2="0" y2="960"/>
    <line x1="540" y1="800" x2="1080" y2="960"/>
    <line x1="540" y1="800" x2="540" y2="0"/>
    <line x1="540" y1="800" x2="540" y2="1920"/>
  </g>

  <!-- Central Anime Hero / Character Silhouette -->
  <g filter="url(#characterShadow)">
    <!-- Anime Aura Energy Ring -->
    <circle cx="540" cy="820" r="220" fill="none" stroke="#FF2A6D" stroke-width="6" stroke-dasharray="16 8"/>
    <circle cx="540" cy="820" r="180" fill="none" stroke="#05D9E8" stroke-width="4"/>

    <!-- Anime Silhouette (Head & Shoulders) -->
    <path d="M 540 680 C 510 680, 480 720, 480 770 C 480 810, 500 840, 540 850 C 580 840, 600 810, 600 770 C 600 720, 570 680, 540 680 Z" fill="#0B0914" stroke="#FF2A6D" stroke-width="4"/>
    <!-- Spiky Anime Hair Outline -->
    <path d="M 470 740 L 430 700 L 480 710 L 450 640 L 510 670 L 540 600 L 570 670 L 630 640 L 600 710 L 650 700 L 610 740 Z" fill="#FF2A6D" opacity="0.9"/>
    
    <!-- Glowing Anime Eyes -->
    <ellipse cx="515" cy="770" rx="14" ry="8" fill="#FFD700"/>
    <ellipse cx="565" cy="770" rx="14" ry="8" fill="#FFD700"/>
    <circle cx="515" cy="770" r="4" fill="#FFFFFF"/>
    <circle cx="565" cy="770" r="4" fill="#FFFFFF"/>
    
    <!-- Character Shoulders -->
    <path d="M 380 980 C 380 890, 460 870, 540 870 C 620 870, 700 890, 700 980 L 700 1100 L 380 1100 Z" fill="#130F24" stroke="#05D9E8" stroke-width="4"/>
  </g>

  <!-- Cyberpunk Floating Sparkle Particles -->
  <circle cx="320" cy="620" r="6" fill="#FFD700" opacity="0.8"/>
  <circle cx="760" cy="580" r="8" fill="#FF2A6D" opacity="0.9"/>
  <circle cx="280" cy="940" r="5" fill="#05D9E8" opacity="0.8"/>
  <circle cx="820" cy="980" r="7" fill="#FFD700" opacity="0.9"/>
  <circle cx="440" cy="1150" r="6" fill="#FF2A6D" opacity="0.85"/>
  <circle cx="640" cy="1180" r="5" fill="#05D9E8" opacity="0.8"/>

  <!-- Anime Banner Overlay -->
  <rect x="240" y="1260" width="600" height="90" rx="45" fill="rgba(15, 12, 32, 0.85)" stroke="#FF2A6D" stroke-width="3"/>
  <text x="540" y="1315" font-family="Inter, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    ANIME CINEMATIC REEL
  </text>
  
  <!-- Top Anime Series Tag -->
  <rect x="360" y="220" width="360" height="60" rx="30" fill="rgba(255, 42, 109, 0.25)" stroke="#FF2A6D" stroke-width="2"/>
  <text x="540" y="258" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#FFD700" text-anchor="middle" letter-spacing="3">
    🎌 ANIME ANIMATION 9:16
  </text>
</svg>